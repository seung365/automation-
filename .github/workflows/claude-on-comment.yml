name: Claude On Comment

# 아무 이슈에나 "/claude <요청>" 댓글을 달면 Claude가 그 이슈의 글을 요청대로 고쳐 댓글로 단다
#   혜택 카드(benefit 라벨) → 카드 문구·캡션을 고치고 카드를 다시 그려 댓글로 (예: /claude 표지 문구 더 짧게)
#   그 외(블로그 초안·쉐어링크 등) → 고친 글 전체를 댓글로 (예: /claude 말투 더 귀엽게, 2문단 줄여줘)
# 고친 댓글이 가장 최근 버전이 되므로 /insta는 그 캡션·카드로 올라간다
on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  edit:
    # 내 댓글만 (구독 사용량이 나간다)
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      COMMENT: ${{ github.event.comment.body }}
      BENEFIT: ${{ contains(github.event.issue.labels.*.name, 'benefit') }}
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes > /dev/null
      - uses: actions/checkout@v5

      - name: 이슈 내용·요청 모으기
        run: |
          fail() { gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "> ⚠️ $1"; exit 1; }
          request="${COMMENT#/claude}"
          [ -n "${request// /}" ] || fail "무엇을 고칠지 '/claude' 뒤에 적어 주세요. 예: /claude 첫 문단 더 짧게"
          printf '%s\n' "$request" > request.txt
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,comments > issue.json
          jq -r '"# 이슈 제목: \(.title)\n\n## 본문\n\(.body)\n" + ([.comments[] | "\n## 댓글 (\(.author.login))\n\(.body)\n"] | join(""))' issue.json > issue.md
          if [ "$BENEFIT" = true ]; then
            echo benefit > mode.txt
            # 가장 최근 카드 문구와 캡션을 꺼낸다 (본문 또는 이전 /claude 댓글)
            jq -r '[.body, .comments[].body] | map(select(test("```json card"))) | last // ""' issue.json \
              | sed -n '/^```json card$/,/^```$/p' | sed '1d;$d' > card.json
            [ -s card.json ] || fail "이 이슈에는 카드 문구(card.json)가 없어요. /claude가 생기기 전에 만든 이슈예요."
            jq -r '[.body, .comments[].body] | map(select(test("(^|\n)## 인스타 캡션"))) | last // ""' issue.json \
              | sed -n '/^## 인스타 캡션/,$p' | tail -n +2 | sed 's/～/~/g' > insta.txt
            echo "SERVICE_ID=$(jq -r .title issue.json | awk '{print $NF}')" >> "$GITHUB_ENV"
          else
            echo text > mode.txt
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Write,Edit,WebSearch,WebFetch"
          prompt: |
            request.txt는 이 이슈 주인의 수정 요청이고, issue.md는 이 이슈의 전체 내용(본문과 댓글)이다. mode.txt를 먼저 읽어.

            mode가 benefit이면 (인스타 혜택 카드뉴스):
            - card.json(카드 문구)과 insta.txt(캡션)를 요청대로 직접 고쳐. 다른 파일은 만들지 마.
            - 형식은 benefit/card.example.json과 같게 유지해 (slides 타입: cover / calc / amount / tips / steps / outro).
            - calc의 금액은 코드가 phases×wages로 계산한다. calc가 있으면 cover title은 가장 큰 wages의 합계와 같아야 한다.
            - 새 사실·숫자를 지어내지 마. 요청이 원문 확인이 필요한 사실 변경이면 그 자리에 "확인 필요"라고 써.
            - 강조는 *단어*로만, 해시태그는 5개 이하.

            mode가 text이면 (블로그 초안·쉐어링크 글 등):
            - reply.md에 요청을 반영한 "고친 글 전체"를 써. 바뀐 부분만 쓰지 말고 바로 복사해 쓸 수 있는 완성본으로.
            - 고칠 대상은 issue.md에서 가장 최근 버전의 글이다 (나중 댓글의 초안이 본문보다 최신). 글이 여러 편이면 요청이 가리키는 글만.
            - 원래 구조(첫 줄 "# 제목", [사진: …] 자리, 참고한 링크, 태그 줄, "## 인스타 캡션" 섹션)는 그대로 유지해.
            - 요청이 수정이 아니라 질문이면 reply.md에 짧게 답만 써.
            - 사실(가격·위치·제품명)을 새로 넣어야 하면 WebSearch로 확인한 것만 쓰고, 확인 못 하면 [확인 필요]로 비워 둬.

      - name: 결과 댓글
        env:
          MEDIA_TOKEN: ${{ secrets.INSTA_MEDIA_TOKEN }} # simple-init Contents 쓰기 전용
        run: |
          fail() { gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "> ⚠️ $1"; exit 1; }
          if [ "$BENEFIT" = true ]; then
            bash benefit/build-body.sh "$SERVICE_ID" || fail "카드를 다시 그리지 못했어요. Actions 로그를 확인해 주세요."
            { echo "요청대로 고친 카드예요. 이대로 올리려면 /insta"; echo; cat body.md; } > reply.md
          fi
          [ -s reply.md ] || fail "Claude가 결과를 쓰지 못했어요. Actions 로그를 확인해 주세요."
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reply.md
