name: 오늘의 특가 & 꿀템 글 요청
description: 토스 앱에서 만든 쉐어링크로 오늘의 모음 글 초안을 받아요
title: "[오늘의 특가] "
labels: [sharelink]
body:
  - type: markdown
    attributes:
      value: 링크는 토스 앱 '팔릴 때마다 돈 버는 링크 공유하기'로 만들어 주세요. 일반 공유 링크는 수익이 안 잡혀요.
  - type: input
    id: deal_link
    attributes:
      label: 선착순 특가 — 쉐어링크
      placeholder: https://toss.im/_m/...
    validations:
      required: true
  - type: input
    id: deal_info
    attributes:
      label: 선착순 특가 — 상품명 · 가격 · 구성
      placeholder: "OO 물티슈 / 9,900원 / 100매 x 10팩, 무료배송"
    validations:
      required: true
  - type: input
    id: pick1_link
    attributes:
      label: 꿀템 1 — 쉐어링크
  - type: input
    id: pick1_info
    attributes:
      label: 꿀템 1 — 상품명 · 가격 · 구성
  - type: input
    id: pick2_link
    attributes:
      label: 꿀템 2 — 쉐어링크
  - type: input
    id: pick2_info
    attributes:
      label: 꿀템 2 — 상품명 · 가격 · 구성
  - type: input
    id: pick3_link
    attributes:
      label: 꿀템 3 — 쉐어링크
  - type: input
    id: pick3_info
    attributes:
      label: 꿀템 3 — 상품명 · 가격 · 구성
  - type: textarea
    id: memo
    attributes:
      label: 메모 (선택)
      description: 직접 써본 느낌, 고른 이유 등. 있으면 글에 반영해요
