name: Blog Request Draft

# '내 사진으로 블로그 글 요청' 이슈(blog-request 라벨)가 열리면 그 사진·정보로 초안을 써서 댓글로 단다
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "초안을 다시 쓸 이슈 번호"
        required: true

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.issue.labels.*.name, 'blog-request') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: 요청 내용 저장
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > request.md
          curl -fsSL https://rss.blog.naver.com/oooozzii.xml -o recent-posts.xml || echo "RSS를 가져오지 못했어요"

      # 비공개 레포 첨부 사진은 개인 토큰이라야 열린다 (Actions 기본 토큰은 404). 못 받으면 사진 설명만으로 쓴다
      - name: 첨부 사진 받기
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          mkdir -p photos
          grep -oE 'https://github\.com/user-attachments/assets/[0-9a-f-]+' request.md | awk '!seen[$0]++' > photo-urls.txt || true
          i=0
          while IFS= read -r url; do
            i=$((i + 1))
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "photos/raw" "$url"; then
              case "$(file -b --mime-type photos/raw)" in
                image/jpeg) ext=jpg ;; image/png) ext=png ;; image/webp) ext=webp ;; image/gif) ext=gif ;; *) ext="" ;;
              esac
              [ -n "$ext" ] && mv photos/raw "photos/$i.$ext" && echo "사진 $i 받음" && continue
            fi
            rm -f photos/raw; echo "사진 $i 못 받음: $url"
          done < photo-urls.txt
          ls photos

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,WebSearch,WebFetch"
          prompt: |
            request.md는 내가 직접 다녀온 가게(또는 써 본 제품)의 정보·사진·후기다. 이걸로 네이버 블로그 "oooozzii"에 올릴 글 초안을 써서 post.md에 저장해.

            블로그 컨셉: 뷰티 · 패션 · 카페 · 꿀정보. MZ 감성으로 고른 핫템 소개.
            말투: 해요체에 귀여운 말끝("~에옹", "~더라구요", "~해죠요"), 문단마다 ⸝⸝ ‧₊˚✩ ₍ᐢ.ˬ.ᐢ₎ ଘ(੭ˊᵕˋ)੭ 같은 이모티콘을 가볍게.
            내 블로그 최근 글: recent-posts.xml (네이버 블로그 RSS). 파일이 있으면 먼저 읽고 말투·문장 길이·이모티콘 쓰는 방식을 맞춰.

            사진: photos/ 폴더의 N.jpg(또는 .png 등)가 request.md에 올린 N번째 사진이다. 하나씩 Read로 직접 보고
            - 사진에 보이는 것(메뉴, 인테리어, 제품, 발색 등)을 글 흐름에 맞게 순서대로 배치해. 사진 자리는 {{PHOTO_N}} 한 줄 + 바로 아래 짧은 사진 설명 한 줄.
            - 모든 사진을 한 번씩 써. 사진에 없는 걸 있다고 쓰지 마.
            - photos/가 비어 있거나 일부가 없으면 request.md에 적힌 사진 설명으로 배치하고, 없는 사진 자리는 [사진 N: 설명]으로 둬.

            규칙:
            - request.md의 정보와 후기가 글의 중심이다. 후기에 쓴 경험은 내 말투로 살려서 쓰고, 후기에 없는 경험(맛, 사용감, 분위기 평가)은 지어내지 마.
              후기가 비어 있으면 [내 후기: ...] 자리를 남겨 둬.
            - 정보가 빈 항목(주소, 영업시간, 가격 등)만 WebSearch로 보충해. 확인된 것만 쓰고 출처를 글 맨 끝 "참고한 링크"에 남겨. 확인 못 하면 [확인 필요]로 비워 둬.
            - request.md 정보와 검색 결과가 다르면 request.md를 따르고, 다르다는 걸 (발행 전 확인 필요)로 표시해.
            - 가격은 원화(₩)로.
            - 첫 줄은 "# 글 제목" (가게·제품 이름이 들어가게), 그 아래 본문. 본문은 1500자 안팎.
            - 맨 마지막 줄(참고한 링크 다음)에 "태그: #태그1 #태그2 ..." 10개 안팎. 가게·제품 이름, 지역, 카테고리, 메뉴에서 뽑고, 글과 상관없는 인기 태그는 넣지 마.

      - name: 초안을 댓글로 달기
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          [ -s post.md ] || { gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "초안을 만들지 못했어요. Actions 로그를 확인해 주세요."; exit 1; }

          # {{PHOTO_N}} 자리에 내가 올린 사진을 그대로 보여 준다 (이슈와 같은 레포라 댓글에서도 열린다)
          body="$(cat post.md)"; i=0
          while IFS= read -r url; do
            i=$((i + 1))
            body="${body//"{{PHOTO_$i}}"/![사진 $i]($url)}"
          done < photo-urls.txt
          printf '%s\n' "$body" | sed -E 's/\{\{PHOTO_([0-9]+)\}\}/[사진 \1]/g' > post.md

          for try in 1 2 3; do
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file post.md && exit 0
            echo "댓글 재시도 ($try)"; sleep 15
          done
          exit 1
