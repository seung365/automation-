name: Image On Comment

# 초안 이슈에 "/image [추가 요청]" 댓글을 달면 썸네일을 새로 뽑아 댓글로 단다
#   /image              → 지금 썸네일을 다른 구도로 다시 재구성
#   /image 흰 배경으로   → 뒤에 쓴 말을 프롬프트에 덧붙여 재구성
#   /image 무드컷        → 제목 분위기의 무드컷 (썸네일이 없는 이슈도 무드컷)
on:
  issue_comment:
    types: [created]

# daily-blog-draft와 같은 그룹: Higgsfield 갱신 토큰이 1회용이라 두 실행이 겹치면 한쪽 인증이 끊긴다
concurrency:
  group: daily-blog-draft
  cancel-in-progress: false

jobs:
  image:
    # 공개 레포라 남이 단 /image로 크레딧이 나가지 않게 내 댓글만
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/image') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      HIGGSFIELD_CREDENTIALS_PATH: /tmp/higgsfield/credentials
      HIGGSFIELD_WORKSPACE_ID: 920c5520-4144-482b-a20f-e4a5d32e7f94
      HIGGSFIELD_NO_UPDATE_CHECK: "1"
      HIGGSFIELD_DISABLE_TELEMETRY: "1"
    steps:
      - name: 접수 표시
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes > /dev/null

      - name: 이미지 도구 준비
        run: python3 -m venv /tmp/py && /tmp/py/bin/pip install -q pillow==11.0.0

      - name: 썸네일 다시 만들기
        id: gen
        env:
          HIGGSFIELD_CREDENTIALS: ${{ secrets.HIGGSFIELD_CREDENTIALS }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
          # ponytail: daily-blog-draft.yml의 재구성 프롬프트 복사본. 바꿀 땐 두 곳 다 고친다
          RECOMPOSE_PROMPT: >-
            Recreate Image 1 as a new photo from a different camera angle and framing.
            Keep the same product or menu item exactly (shape, colors, label text, toppings).
            A hand holding or using it, soft natural daylight, unretouched smartphone photo look, simple light background.
            Only if Image 1 already shows a swatch or texture on the skin, keep that same color;
            never add swatches, marks or makeup on the skin that are not in Image 1.
            Do not reproduce the original framing or background. No faces, no text overlays, no watermarks.
          RECOMPOSE_PROMPT_FASHION: >-
            Recreate Image 1 as a new outfit photo from a different camera angle and framing.
            Keep the same garment exactly (cut, color, fabric, pockets, details).
            A person wearing it, framed from the neck down, natural daylight on a city street or a bright room, unretouched smartphone photo look.
            Do not reproduce the original framing or background. No faces, no text overlays, no watermarks.
        run: |
          extra="$(printf '%s' "${COMMENT#/image}" | tr '\n' ' ' | sed -E 's/^ +| +$//g')"
          src="$(printf '%s' "$BODY" | grep -oE '!\[썸네일\]\(https://[^)]+\)' | head -1 | sed -E 's/.*\((.*)\)/\1/' || true)"
          # 제목이 "[2026-10-19 Tue] ..." 꼴이라 패션 요일(Tue·Sat)은 착샷 프롬프트로
          case "$TITLE" in "["*" Tue]"*|"["*" Sat]"*) RECOMPOSE_PROMPT="$RECOMPOSE_PROMPT_FASHION" ;; esac

          v=1.1.27
          base="https://github.com/higgsfield-ai/cli/releases/download/v$v"
          curl -fsSLO "$base/hf_${v}_linux_amd64.tar.gz" -O "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar xzf "hf_${v}_linux_amd64.tar.gz" hf

          mkdir -p "$(dirname "$HIGGSFIELD_CREDENTIALS_PATH")"
          (umask 077; printf '%s' "$HIGGSFIELD_CREDENTIALS" > "$HIGGSFIELD_CREDENTIALS_PATH")

          # ponytail: CLI가 응답 없이 멈추는 경우가 있어 3분 제한 + 1회 재시도
          hf() { for _ in 1 2; do timeout 180 ./hf "$@" && return 0; echo "hf 재시도"; done; return 1; }

          if [ -n "$src" ] && [[ "$extra" != *무드컷* ]] && curl -fsSL -o source.img "$src" && /tmp/py/bin/python -c "
          from PIL import Image
          im = Image.open('source.img').convert('RGBA')
          Image.alpha_composite(Image.new('RGBA', im.size, 'white'), im).convert('RGB').save('source.png')"; then
            hf generate create nano_banana_flash --image source.png --aspect_ratio 1:1 --resolution 2k --prompt "$RECOMPOSE_PROMPT $extra" --wait --json > gen.json
            url="$(jq -r '.[0].min_result_url // .[0].result_url' gen.json)" # 원본 PNG(~6MB)는 GitHub 이미지 프록시 한도를 넘어 깨진다
          else
            hf generate create z_image --prompt "Aesthetic mood photo for a Korean lifestyle blog post titled \"${TITLE#*] }\". $extra Soft natural light, unretouched smartphone photo look. No faces, no brand logos, no text." --wait --json > gen.json
            url="$(jq -r '.[0].min_result_url' gen.json)"
          fi
          [ -n "$url" ] && [ "$url" != null ] || { echo "이미지 URL 없음"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 실행 중 갱신된 1회용 토큰을 Secret에 되써야 다음 실행이 인증된다
      - name: Higgsfield 인증 저장
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          [ -s "$HIGGSFIELD_CREDENTIALS_PATH" ] || { echo "인증 파일 없음 — 다시 로그인 필요할 수 있음"; exit 0; }
          gh secret set HIGGSFIELD_CREDENTIALS --repo "$GITHUB_REPOSITORY" < "$HIGGSFIELD_CREDENTIALS_PATH"

      - name: 댓글로 달기
        if: always()
        env:
          URL: ${{ steps.gen.outputs.url }}
        run: |
          if [ -n "$URL" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "![썸네일]($URL)"
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "> ⚠️ 이미지를 새로 만들지 못했어요. Actions 로그를 확인해 주세요."
          fi
