name: Daily Blog Draft

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:
    inputs:
      day:
        description: "테스트용 요일 (Mon~Sun). 비우면 오늘"
        required: false

# Higgsfield 갱신 토큰은 1회용이라 두 실행이 겹치면 한쪽 인증이 끊긴다
concurrency:
  group: higgsfield # blog-request의 패션 재구성과 같은 1회용 토큰을 쓴다
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      HIGGSFIELD_CREDENTIALS_PATH: /tmp/higgsfield/credentials
      HIGGSFIELD_WORKSPACE_ID: 920c5520-4144-482b-a20f-e4a5d32e7f94
      HIGGSFIELD_NO_UPDATE_CHECK: "1"
      HIGGSFIELD_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - name: 오늘 날짜
        env:
          DAY: ${{ inputs.day }}
        run: echo "TODAY=$(TZ=Asia/Seoul date '+%Y-%m-%d') ${DAY:-$(TZ=Asia/Seoul date +%a)}" >> "$GITHUB_ENV"

      - name: 내 블로그 최근 글 가져오기
        run: curl -fsSL https://rss.blog.naver.com/oooozzii.xml -o recent-posts.xml || echo "RSS를 가져오지 못했어요"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,WebSearch,WebFetch"
          prompt: |
            오늘은 ${{ env.TODAY }}이다. 네이버 블로그 "oooozzii"에 올릴 글 초안 한 편을 써서 post.md 파일로 저장해.

            블로그 컨셉: 뷰티 · 카페 · 맛집 · 꿀정보. MZ 감성으로 고른 핫템 소개.
            말투: 해요체에 귀여운 말끝("~에옹", "~더라구요", "~해죠요"), 문단마다 ⸝⸝ ‧₊˚✩ ₍ᐢ.ˬ.ᐢ₎ ଘ(੭ˊᵕˋ)੭ 같은 이모티콘을 가볍게.

            요일별 카테고리: Mon 뷰티 / Tue 맛집 / Wed 카페 / Thu 꿀정보 / Fri 뷰티 / Sat 맛집 / Sun 카페

            내 블로그 최근 글: recent-posts.xml (네이버 블로그 RSS). 파일이 있으면 먼저 읽고
            - 말투·문장 길이·이모티콘 쓰는 방식을 이 글들에 맞춰.
            - 최근 글과 같은 제품·장소·주제는 피해.

            규칙:
            - WebSearch로 요즘 실제로 화제인 제품·장소를 찾아서 써. 제품명·가격·위치는 검색으로 확인한 것만 쓰고, 글 맨 끝에 "참고한 링크" 목록을 남겨.
            - 가격은 한국 판매가를 원화(₩)로 써. 해외몰·달러 가격은 쓰지 마. 원화 가격을 확인 못 하면 [가격 확인 필요]로 비워둬.
            - 출처는 브랜드 공식몰·공식 보도자료·국내 판매처(올리브영, 무신사, 네이버 스토어 등) 상품 페이지·주요 언론을 우선해. 해외 리셀러·SEO용 블로그는 다른 출처가 없을 때만 쓰고, 그 정보에는 (발행 전 확인 필요)를 붙여.
            - 직접 써보거나 가본 것처럼 지어내지 마. 경험 문장 없이 정보 위주로 쓰고, 후기 자리를 [ ]로 비워 두지도 마.
            - 사진 들어갈 자리는 [사진: 설명]으로 표시.
            - 첫 줄은 "# 글 제목", 그 아래 본문. 본문은 1500자 안팎.
            - 맨 마지막 줄(참고한 링크 다음)에 "태그: #태그1 #태그2 ..." 10개 안팎. 제품명·브랜드·카테고리·상황에서 뽑고, 글과 상관없는 인기 태그는 넣지 마.

            그리고 mood.txt에 이 글 분위기의 감성 무드컷 이미지 프롬프트를 영어 한 문단으로 써. (제품 사진을 못 구했을 때 썸네일로 쓴다. 사람 얼굴·브랜드 로고·글자 금지)

            그리고 insta.txt에 같은 내용의 인스타그램 캡션을 써.
            - 블로그 말투 그대로 300~500자. 첫 줄은 눈길 끄는 한 문장.
            - [ ] 빈칸, (발행 전 확인 필요)·[가격 확인 필요]가 붙은 정보, 링크는 넣지 마. (캡션 링크는 눌리지 않는다)
            - 맨 끝 줄에 해시태그 15개 이하.

      - name: 이미지 도구 준비
        run: python3 -m venv /tmp/py && /tmp/py/bin/pip install -q pillow==12.0.0

      # 사진 찾기는 따로 돌린다 — 실패하거나 턴을 넘겨도 위에서 쓴 글은 그대로 이슈로 올라가고 썸네일만 무드컷으로 대체된다
      - uses: anthropics/claude-code-action@v1
        id: photo
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,WebSearch,WebFetch,Bash(curl:*),Bash(grep:*),Bash(head:*),Bash(sed:*),Bash(cut:*),Bash(sort:*),Bash(tr:*),Bash(file:*),Bash(ls:*),Bash(/tmp/py/bin/python scripts/preview.py),Bash(rm candidate.img),Bash(mv candidate.img product.img)"
          prompt: |
            post.md는 오늘 블로그 글 초안이다. 이 글의 대표 제품(카페·맛집 글이면 대표 메뉴)을 실제로 사용한 후기 사진 1장을 준비해. 이 사진을 AI로 구도를 바꿔 재구성해서 썸네일로 쓴다.

            1. WebSearch로 "<제품명> 후기", "<제품명> 발색", "<제품명> 사용" 등을 검색해 실제 사용 사진이 있는 후기 글(블로그·커뮤니티·리뷰)을 찾고, 페이지에서 이미지 URL을 찾아 curl로 candidate.img에 받아.
               예: curl -sL -A "Mozilla/5.0" "<페이지>" | grep -oiE 'https://[^"]+\.(jpg|jpeg|png|webp)' | head -20
                   curl -sL -A "Mozilla/5.0" -o candidate.img "<이미지 URL>"
               네이버 블로그는 본문이 iframe이라 https://m.blog.naver.com/<아이디>/<글번호> 모바일 주소로 열어야 이미지 URL이 보여.
               네이버 이미지 URL은 끝의 ?type=을 w800으로 바꿔 받아 (w80_blur는 흐린 미리보기라 안 돼).
               쇼핑몰 후기 페이지는 자바스크립트로 그려져서 curl로는 이미지가 안 나와. 네이버 블로그 후기부터 찾아.
               cd나 ;로 여러 명령을 이어 붙이면 거부되니 명령은 하나씩(파이프는 괜찮아) 실행해.
               후기 페이지를 5곳 이상 확인하기 전에는 포기하지 마.
            2. `/tmp/py/bin/python scripts/preview.py`를 실행하면 크기가 출력되고 candidate_preview.jpg(축소본)가 생겨. 이걸 Read로 직접 열어 봐서 아래를 모두 만족하는지 확인해. (원본을 줄이는 다른 방법은 쓰지 마)
               - 그 제품을 실제로 쓰는 사진: 제품이 보이고 발색·텍스처·사용 모습이 보임 (손등 발색, 손에 든 컷 등)
               - 사람 얼굴 없음 (손은 괜찮아)
               - 워터마크·작성자 표시·글자가 박힌 사진은 쓰지 마. 지우지 말고 다른 사진을 찾아.
               - 긴 변 600px 이상
            3. 통과하면 바로 이 두 가지를 해:
               - source.txt에 사진을 가져온 페이지 URL 한 줄 저장
               - `mv candidate.img product.img`
               통과 못 하면 `rm candidate.img` 하고 다른 사진을 찾아. 끝내 못 찾으면 product.img 없이 끝내도 돼.

      - name: 사진 찾기 기록 (실행한 명령 · 거부된 명령)
        if: always()
        env:
          EXEC_FILE: ${{ steps.photo.outputs.execution_file }}
        run: |
          [ -f "$EXEC_FILE" ] || exit 0
          echo "== 거부된 명령"
          jq -r '[.. | objects | select(has("permission_denials")) | .permission_denials[]?] | .[] | "\(.tool_name): \(.tool_input.command // (.tool_input | tostring))"' "$EXEC_FILE" | cut -c1-300 || true
          echo "== 실행한 Bash 명령"
          jq -r '.. | objects | select(.type == "tool_use" and .name == "Bash") | .input.command' "$EXEC_FILE" | cut -c1-300 || true

      - name: 썸네일 만들기 (후기 사진을 AI로 재구성)
        id: thumb
        continue-on-error: true
        env:
          HIGGSFIELD_CREDENTIALS: ${{ secrets.HIGGSFIELD_CREDENTIALS }}
          RECOMPOSE_PROMPT: >-
            Recreate Image 1 as a new photo from a different camera angle and framing.
            Keep the same product or menu item exactly (shape, colors, label text, toppings).
            A hand holding or using it, soft natural daylight, unretouched smartphone photo look, simple light background.
            Only if Image 1 already shows a swatch or texture on the skin, keep that same color;
            never add swatches, marks or makeup on the skin that are not in Image 1.
            Do not reproduce the original framing or background. No faces, no text overlays, no watermarks.
        run: |
          v=1.1.27
          base="https://github.com/higgsfield-ai/cli/releases/download/v$v"
          curl -fsSLO "$base/hf_${v}_linux_amd64.tar.gz" -O "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar xzf "hf_${v}_linux_amd64.tar.gz" hf

          mkdir -p "$(dirname "$HIGGSFIELD_CREDENTIALS_PATH")"
          (umask 077; printf '%s' "$HIGGSFIELD_CREDENTIALS" > "$HIGGSFIELD_CREDENTIALS_PATH")

          py=/tmp/py/bin/python # '이미지 도구 준비' 단계에서 설치

          # ponytail: CLI가 응답 없이 멈추는 경우가 있어 3분 제한 + 1회 재시도
          hf() { for _ in 1 2; do timeout 180 ./hf "$@" && return 0; echo "hf 재시도"; done; return 1; }

          # product.img(jpg/png/webp 무엇이든)를 흰 바탕 PNG로 정규화하고 긴 변 크기를 출력
          if [ -s product.img ] && side="$($py -c "
          from PIL import Image
          im = Image.open('product.img').convert('RGBA')
          Image.alpha_composite(Image.new('RGBA', im.size, 'white'), im).convert('RGB').save('product.png')
          print(max(im.size))")"; then
            echo "원본 후기 사진 긴 변: ${side}px"
            hf generate create nano_banana_flash --image product.png --aspect_ratio 1:1 --resolution 2k --prompt "$RECOMPOSE_PROMPT" --wait --json > gen.json
            url="$(jq -r '.[0].min_result_url // .[0].result_url' gen.json)" # 원본 PNG(~6MB)는 GitHub 이미지 프록시 한도를 넘어 깨진다
            src="$(head -n1 source.txt 2>/dev/null || true)"
          else
            hf generate create z_image --prompt "$(cat mood.txt)" --wait --json > gen.json
            url="$(jq -r '.[0].min_result_url' gen.json)" # 원본 PNG(~6MB)는 GitHub 이미지 프록시 한도를 넘어 깨진다
            note="> 썸네일: 쓸 만한 제품 사진을 못 찾아 무드컷으로 만들었어요."
          fi
          [ -n "$url" ] && [ "$url" != null ] || { echo "이미지 URL 없음"; exit 1; }
          { head -n1 post.md; printf '\n![썸네일](%s)\n\n%s\n' "$url" "$note"; tail -n +2 post.md; } > post.tmp && mv post.tmp post.md

      # 실행 중 갱신된 1회용 토큰을 Secret에 되써야 다음 날 실행이 인증된다
      - name: Higgsfield 인증 저장
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          [ -s "$HIGGSFIELD_CREDENTIALS_PATH" ] || { echo "인증 파일 없음 — 다시 로그인 필요할 수 있음"; exit 0; }
          gh secret set HIGGSFIELD_CREDENTIALS --repo "$GITHUB_REPOSITORY" < "$HIGGSFIELD_CREDENTIALS_PATH"

      - name: 이슈로 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.thumb.outcome }}" = failure ]; then
            printf '\n> ⚠️ 썸네일 생성 실패 — Actions 로그를 확인해 주세요.\n' >> post.md
          fi
          # 맨 끝에 둔다 — /insta가 이 제목 아래 전부를 캡션으로 쓴다
          [ -s insta.txt ] && printf '\n## 인스타 캡션\n%s\n' "$(cat insta.txt)" >> post.md
          title="$(head -n1 post.md | sed 's/^# *//')"
          # GitHub API가 가끔 일시 오류(GraphQL: Something went wrong)를 내서 최대 3번 시도
          for i in 1 2 3; do
            gh issue create --title "[$TODAY] $title" --body-file post.md && exit 0
            echo "이슈 생성 재시도 ($i)"; sleep 15
          done
          exit 1
