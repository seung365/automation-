name: Benefit Daily Card

# 매일 육아 혜택 카드뉴스 초안을 이슈로 올린다 (라벨 benefit)
# 확인 후 이슈에 /insta 댓글 → insta-on-comment가 @oooo.zzii에 캐러셀로 올린다
on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST
  workflow_dispatch:

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: 오늘 혜택 고르기
        run: |
          # 이슈 제목 끝이 서비스ID → 이미 올린 건 제외
          gh issue list --label benefit --state all --limit 1000 --json title --jq '.[].title | split(" ") | last' > used.txt || true
          pick="$(python3 benefit/pick.py used.txt)"
          echo "PICK=$pick" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 10
            --allowedTools "Read,Write"
          prompt: |
            detail.json은 정부24 공공서비스 원문이다. 인스타 @oooo.zzii '꿀정보' 카드뉴스 card.json과 캡션 insta.txt를 써.
            card.json 형식은 benefit/card.example.json을 그대로 따라 (먼저 읽어). 목표는 저장·공유를 부르는 카드다.

            슬라이드 타입 (5~6장, 순서는 cover → 2장 → … → outro):
            - cover: kicker(대상 호명 + 상황, 12자 이내) / title(숫자 하나, 10자 이내, 예: "2,310만 원") / cond(그 숫자의 조건, 예: "월급 250만 원 이상 · 일반 기준") / say(말풍선)
            - calc: 매달 받는 혜택일 때만. phases = [[기간, 지급률(0~1), 월 상한(만 원), 개월 수], ...], wages = 예시 월급 3개(만 원), unit "만 원".
              금액은 코드가 계산하니 직접 쓰지 마. 이 경우 cover title은 가장 큰 wages의 합계와 같아야 한다(코드가 검사한다).
            - amount: 일시금·바우처·감면 혜택. rows = [[조건, 값]], 값은 15자 이내 (예: "200만 원").
            - tips: "놓치면 손해" 3가지. items = [[이모지 1개, 결론을 담은 소제목, 설명 1줄]]. 소제목은 명사가 아니라 결과로 ("12개월 지나면 0원").
            - steps: 신청 방법 3단계. note에 문의처.
            - outro: title(저장 유도), checks(요약 체크 3줄, 각 15자 이내), sub(공유 대상을 지정: "곧 ○○하는 친구한테 보내주기 💌").

            규칙:
            - detail.json에 있는 사실만 쓴다. 금액·기한·대상을 추측하거나 다른 데서 가져오지 마.
            - "최대 ○원"은 원문의 모든 경우 중 최댓값일 때만 써. 특례(한부모·부모 동시 사용 등)가 더 크면 cond에 "일반 기준"을 밝혀.
            - 2장은 표지를 안 본 사람에게도 따로 보여진다. 2장 제목만 보고도 무슨 얘기인지, 왜 저장해야 하는지 알게 써 (예: "내 월급이면 얼마?").
            - say는 계정 말투로 짧게: 해요체 + "~더라구요" 같은 말끝, ₍ᐢ.ˬ.ᐢ₎ 같은 이모티콘은 덱 전체에 1~2번. cover에는 꼭 넣고, 다른 장은 1곳까지.
            - 강조는 *단어* 한두 개만. 그 외에는 * 문자를 쓰지 마.
            - 원문이 모호하면 그 자리에 "확인 필요"라고 써. (캡션에 남아 있으면 게시가 막힌다)
            - serviceId는 detail.json의 서비스ID, source는 "정부24 공공서비스 정보 · <수정일시> 수정 기준".
            - 정책 평가·정치색 금지, "아무도 안 알려주는" 같은 과장 금지.

            insta.txt:
            - 첫 줄에 검색어를 넣어 (제도명 + "신청 방법"/"계산" 등, 예: "육아휴직급여 계산, 내 월급이면 얼마일까요?").
            - 이어서 핵심 3줄(계정 말투), 신청처, 출처·기준일, 저장·공유 한 줄 (받을 사람 지정).
            - 링크 넣지 마 (캡션 링크는 눌리지 않는다). 맨 끝 줄에 해시태그 5개 이하 (인스타 제한).

      - name: 카드 그리기 → 업로드 → 이슈
        env:
          MEDIA_TOKEN: ${{ secrets.INSTA_MEDIA_TOKEN }} # simple-init Contents 쓰기 전용
        run: |
          # 이모지·ᐢ 같은 글자가 □로 깨지지 않게 (ubuntu 러너 기본 폰트에 없다)
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-core > /dev/null
          python3 benefit/render.py card.json out # ubuntu 러너에 google-chrome 기본 설치
          python3 -m venv /tmp/py && /tmp/py/bin/pip install -q pillow==12.0.0
          id="${PICK##* }"
          : > body.md
          for png in $(ls out/*.png | sort -V); do
            n="$(basename "$png" .png)"
            /tmp/py/bin/python -c "from PIL import Image; Image.open('$png').convert('RGB').save('c.jpg', quality=92)"
            # 내 계정과 연결 안 된 작성자로 커밋 → 잔디·프로필 활동에 안 잡힌다
            jq -n --arg m "benefit $id" --rawfile c <(base64 -w0 c.jpg) \
              '{message: $m, content: $c, committer: {name: "insta-bot", email: "insta-bot@oooozzii.invalid"}}' > put.json
            GH_TOKEN="$MEDIA_TOKEN" gh api -X PUT "repos/seung365/simple-init/contents/benefit/$id/$GITHUB_RUN_ID-$n.jpg" --input put.json > /dev/null
            echo "![$n](https://raw.githubusercontent.com/seung365/simple-init/main/benefit/$id/$GITHUB_RUN_ID-$n.jpg)" >> body.md
          done
          # 검수할 때 볼 경고: 렌더 경고(넘침·표지 숫자) + 확인 필요 + 해시태그 수
          grep -q '확인 필요' card.json && echo '카드에 "확인 필요"가 있어요. 원문 확인 후 올려 주세요.' >> out/warnings.txt
          tags=$(grep -o '#[가-힣A-Za-z0-9_]\+' insta.txt | wc -l)
          [ "$tags" -le 5 ] || echo "해시태그가 ${tags}개예요. 인스타는 5개까지만 돼요." >> out/warnings.txt
          [ -s out/warnings.txt ] && { echo; sed 's/^/> ⚠️ /' out/warnings.txt; } >> body.md
          printf '\n원문: %s\n\n## 인스타 캡션\n%s\n' "$(jq -r '.["상세조회URL"]' detail.json)" "$(sed 's/~/～/g' insta.txt)" >> body.md # ~ 두 개는 GitHub에서 취소선이 된다
          gh label create benefit --force > /dev/null
          gh issue create --title "[혜택] $PICK" --label benefit --body-file body.md
