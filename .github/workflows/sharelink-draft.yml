name: Sharelink Draft

# '오늘의 특가 & 꿀템' 이슈(템플릿이 sharelink 라벨을 붙임)가 열리면 모음 글 초안을 댓글로 단다
on:
  issues:
    types: [opened]

jobs:
  draft:
    if: contains(github.event.issue.labels.*.name, 'sharelink') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: 요청 내용 저장
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$BODY" > request.md
          echo "TODAY=$(TZ=Asia/Seoul date '+%-m월 %-d일')" >> "$GITHUB_ENV"
          echo "NOW=$(TZ=Asia/Seoul date '+%-m월 %-d일 %H시')" >> "$GITHUB_ENV"

      # 공유용 링크라 미리보기 이미지(og:image)가 있다 — 원본 그대로 본문에 넣는다 (토스 정책: 상품 이미지 가공 금지)
      - name: 상품 원본 이미지 찾기
        run: |
          # 자동 후보 모드는 로컬 스크립트가 이미지를 이미 적어 준다 (링크를 열면 클릭으로 집계되므로 열지 않음)
          if grep -q '<!-- auto -->' request.md; then
            grep -oE '^- 이미지: [^ ]+' request.md | cut -d' ' -f3 > images.txt
            cat images.txt; exit 0
          fi
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148"
          : > images.txt
          grep -oE 'https://(toss\.im|toss\.shopping)/[^ )>]+' request.md | while read -r link; do
            img="$(curl -fsSL -A "$UA" --max-time 20 "$link" 2>/dev/null | grep -oiE '<meta[^>]*og:image[^>]*>' | head -1 | grep -oiE 'content="[^"]+"' | cut -d'"' -f2 | sed 's/&amp;/\&/g' || true)"
            echo "$link → ${img:-이미지 없음}"
            echo "$img" >> images.txt
          done

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 35
            --allowedTools "Read,Write,WebSearch,WebFetch"
          prompt: |
            request.md에 오늘 소개할 토스쇼핑 상품이 있다. 두 형식 중 하나야.
            - 직접 입력: 선착순 특가 1개, 추천 꿀템 0~3개 (각각 쉐어링크와 상품명·가격·구성). 빈 칸은 무시해.
            - 자동 후보(맨 위에 <!-- auto -->): 쉐어링크 홈에서 모은 후보 목록. 카드 텍스트에서 상품명·가격·평점을 읽어 아래 '고르는 순서'대로 골라.
              "지금 30일 내 최저가예요"는 "토스쇼핑 기준 30일 내 최저가"로만 써.
            이걸로 네이버 블로그 장보기 정보 글 초안을 써서 post.md에 저장해.

            블로그 컨셉: 자취·살림 장보기 정보. 매일 하나의 상황(주말 집밥, 환절기 옷장 정리, 자취방 비상식량 등)을 정해
            "이 상황에서 뭘 어떻게 골라야 하나"를 정보로 먼저 풀고, 그 기준을 오늘 토스쇼핑 특가에 적용해 본다.
            글의 70%는 상품이 없어도 읽을 가치가 있는 정보, 30%가 상품이다. 상품 소개 글이 아니라 정보 글에 예시가 붙은 형태다.
            말투: 차분한 정보형 해요체. 이모지는 거의 쓰지 않는다.

            고르는 순서:
            1. (자동 후보일 때) 오늘 날짜·요일·계절을 보고, 후보 중 2~4개가 자연스럽게 묶이는 상황 하나를 정해.
               '하루특가' 후보가 최소 1개 들어가야 해. 억지로 묶이는 상품은 빼.
               (직접 입력일 때) 입력된 상품이 함께 쓰이는 상황을 정해.
            2. 그 상황에서 사람들이 실제로 검색할 만한 질문 하나를 정해 (예: "굴비 보관법", "곱창김 일반김 차이", "방충제 교체 주기").
               이 질문이 글의 제목과 정보 파트의 주제다.

            구성 (순서 지켜):
            1. 첫 줄 "# [검색 질문에 답하는 제목] — [상황]" (예: "굴비 한 마리 가격 계산과 냉동 보관법 — 주말 집밥 장보기").
               "특가", "최저가", "할인", 날짜는 제목에 넣지 마.
            2. 제목 바로 아래 이 문구 그대로:
               > 이 콘텐츠는 토스쇼핑 쉐어링크 활동의 일환으로, 링크를 통한 구매가 발생하면 일정 수수료를 지급받습니다.
            3. 도입 2~3줄: 어떤 상황에서 이 질문이 생기는지. 매일 다른 문장으로 시작해 ("오늘은", "안녕하세요"로 시작하지 마).
            4. 정보 파트 (## 소제목 2~3개, 소제목 이름은 주제에 맞게 자유롭게):
               - WebSearch로 확인한 사실만 쓰고 문장 끝에 출처를 밝혀 (식약처·농림부·공공기관·제조사·언론 우선).
               - 고르는 기준, 보관·사용법, 단위 가격을 비교하는 법처럼 상품 없이도 쓸모 있는 내용.
               - 여기에는 상품명과 링크를 넣지 마.
            5. ## 이 기준으로 오늘 장바구니를 계산해 보면 (소제목은 바꿔도 돼)
               - 이 문구 그대로 한 줄: "${{ env.NOW }} 기준 토스쇼핑 가격이에요. 선착순 특가는 빨리 품절되거나 가격이 바뀔 수 있어요."
               - 상품 | 결제가 | 단위 가격 표 하나 + 합계 행, 계산식은 표 아래 한 줄씩.
               - 상품마다 ### 상품명, 정보 파트의 기준에 비춰 맞는 점 1줄·아쉬운 점 1줄, [토스쇼핑에서 보기](쉐어링크 그대로).
               - {{IMAGE_k}}는 대표 상품 1개(많아도 2개)에만 넣어 (k = 그 상품의 링크가 request.md에서 몇 번째 링크인지. 자동 후보면 후보 번호).
                 나머지 상품엔 이미지 자리를 두지 마.
            6. 마무리: 정보 파트를 한 줄로 요약한 체크리스트 3개 이내.
            7. ## 참고한 자료 — 검색으로 확인한 링크만.

            규칙:
            - 쉐어링크는 상품당 딱 한 번만. 같은 링크를 반복하거나 "지금 바로 구매" 같은 구매 유도 문구를 쓰지 마.
            - 가격은 request.md 값만 써. 다른 판매처 비교 가격은 WebSearch로 확인된 것만 출처와 함께, 확인 못 하면 비교를 빼.
            - 같은 키워드를 억지로 반복하지 마. 제목 키워드는 본문에 자연스럽게 2~3번이면 충분해.
            - 직접 써본 것처럼 지어내지 마. 메모에 있는 경험만 쓰고, 없으면 [내 후기: ...] 자리를 하나 남겨 둬.
            - "최저가", "역대급"처럼 확인 안 되는 단정 표현과 효능·효과 과장 금지. 식품·건강·의료기기 류는 효능 표현을 쓰지 마.
            - 카드의 "개당 N원 수익"은 내 수수료라 글에 쓰지 말고 고르는 기준으로도 쓰지 마.
            - 쉐어링크 URL은 바꾸거나 줄이지 말고 그대로 써.

      - name: 초안을 댓글로 달기
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -s post.md ] || { gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "초안을 만들지 못했어요. Actions 로그를 확인해 주세요."; exit 1; }

          body="$(cat post.md)"; i=0
          while IFS= read -r url; do
            i=$((i + 1))
            [ -n "$url" ] || continue
            img="![상품 이미지]($url)"$'\n'"<sub>토스쇼핑 원본 이미지 그대로예요. [원본 받기]($url) — 크롭·합성·편집 없이 올려 주세요.</sub>"
            # 토스가 AI로 만든 썸네일은 AI 활용 사실을 함께 표시해야 한다 (쉐어링크 정책)
            [[ "$url" == */taca/ai/* ]] && img+=$'\n'"※ 토스쇼핑이 제공한 AI 생성 이미지예요."
            body="${body//"{{IMAGE_$i}}"/$img}"
          done < images.txt
          # 못 찾은 이미지 자리는 안내 문구로
          printf '%s\n' "$body" | sed -E 's/\{\{IMAGE_[0-9]+\}\}/[상품 이미지: 자동으로 못 가져왔어요. 토스 앱의 원본 이미지를 그대로 넣어 주세요]/g' > post.md

          for i in 1 2 3; do
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file post.md && exit 0
            echo "댓글 재시도 ($i)"; sleep 15
          done
          exit 1
